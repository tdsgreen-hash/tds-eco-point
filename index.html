<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDS Eco Point & Coupon</title>
  <style>
    body { font-family: 'Kanit', sans-serif; text-align: center; padding: 20px; background-color: #f5f5f5; }
    .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    img#profile { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 10px; }
    h2 { color: #00b900; margin: 5px 0; }
    .box { background: #e8f5e9; padding: 10px; border-radius: 8px; margin: 10px 0; }
    button { background: #ff9800; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; box-sizing: border-box; }
    button:disabled { background: #ccc; cursor: not-allowed; }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

  <div class="container">
    <img id="profile" src="https://via.placeholder.com/80" alt="Profile">
    <h3 id="name">Initializing...</h3>
    <p id="statusMessage" style="color: #666; font-style: italic;">Please wait...</p>
    
    <div class="box">
      <p style="margin:0; font-weight: bold; color: #2e7d32;">แต้มสะสมรอแลก (Points)</p>
      <h2><span id="pointDisplay">0</span> pts</h2>
      <button id="convertBtn" onclick="convertPoints()" disabled>แลกเป็นคูปอง (Redeem) 50 THB</button>
      <p style="font-size: 11px; color: #d32f2f; margin-top: 5px;">*จำกัด 1 สิทธิ์/คน สิ้นสุดโครงการ 30 พ.ย. 69</p>
    </div>

    <div class="box" style="background: #e3f2fd;">
      <p style="margin:0; font-weight: bold; color: #1565c0;">ยอดคูปองเงินสดคงเหลือ (Coupon Balance)</p>
      <h2><span id="couponDisplay">0</span> THB</h2>
      <div id="qrBox" style="display:none; margin-top: 10px;">
        <p style="font-size: 12px; color: #d32f2f; font-weight: bold;">แสดง QR นี้ให้ร้านค้าสแกน (หักรวดเดียว 50 บาท)</p>
        <img id="myQrCode" src="" alt="Coupon QR" style="width:140px; height:140px; border: 2px solid #ccc; border-radius: 8px; padding: 4px; background: white;">
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbze86F9Xs1hnIY_KvdKCXXpqkPjUKireyliU8IxmAO-dhLBZq93RQGwlOtarseFlIYU/exec"; 
    const LIFF_ID = "2010933373-leG4HPtR"; 
    let globalUserId = "";

    function startApp() {
      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (liff.isLoggedIn()) {
             liff.getProfile().then(profile => {
               globalUserId = profile.userId;
               document.getElementById("name").innerText = profile.displayName;
               document.getElementById("profile").src = profile.pictureUrl || "https://via.placeholder.com/80";

               // 🚨 โค้ดส่วนที่เพิ่มมาเพื่ออ่านค่าจาก URL (QR Code)
               const urlParams = new URLSearchParams(window.location.search);
               const shopParam = urlParams.get('shop') || "CheckPoint"; // ถ้าไม่มีชื่อร้านให้เป็น CheckPoint
               const pointParam = parseInt(urlParams.get('point')) || 0; // ถ้าไม่มีคะแนนให้เป็น 0

               // ส่งค่าร้านและคะแนนไปบันทึก
               fetchData("add", pointParam, shopParam);
             });
          } else {
             liff.login();
          }
        });
    }

    function fetchData(action, pts, shop) {
      const requestData = { action: action, userId: globalUserId, displayName: document.getElementById("name").innerText, shopName: shop, points: pts };

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(requestData)
      })
      .then(res => res.json())
      .then(result => {
        if (result.status === "success") {
           updateUI(result.points, result.couponBalance, result.hasConverted);
           // เปลี่ยนข้อความแจ้งเตือนให้ตรงกับการใช้งาน
           if (pts > 0) {
               document.getElementById("statusMessage").innerText = `ได้รับ ${pts} แต้ม จาก ${shop} ✅`;
           } else {
               document.getElementById("statusMessage").innerText = "Updated successfully ✅";
           }
        } else if (result.status === "error") {
           document.getElementById("statusMessage").innerText = result.message;
           alert(result.message); // แจ้งเตือน Popup หากโควตาเต็ม
        }
      });
    }

    function convertPoints() {
      if(!confirm("ยืนยันการแลกคูปอง 50 บาท?\n(คุณสามารถแลกได้เพียง 1 ครั้งตลอดโครงการ)")) return;
      
      const requestData = { action: "convert", userId: globalUserId };

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(requestData)
      })
      .then(res => res.json())
      .then(result => {
        if (result.status === "success") {
           updateUI(result.points, result.couponBalance, true);
           alert("แลกคูปองสำเร็จ! ยอดเงินเข้ากระเป๋าคูปองเรียบร้อย");
        } else {
           alert(result.message);
        }
      });
    }

    function updateUI(points, coupon, hasConverted = false) {
      document.getElementById("pointDisplay").innerText = points;
      document.getElementById("couponDisplay").innerText = coupon;

      const btn = document.getElementById("convertBtn");
      
      if (hasConverted) {
         btn.disabled = true;
         btn.innerText = "ใช้งานสิทธิ์ครบแล้ว (Limit Reached)";
         btn.style.background = "#ccc";
      } else if (points >= 50) {
         btn.disabled = false;
         btn.innerText = "แลกเป็นคูปอง (Redeem) 50 THB";
         btn.style.background = "#ff9800";
      } else {
         btn.disabled = true;
         btn.innerText = "แลกเป็นคูปอง (Redeem) 50 THB";
         btn.style.background = "#ccc";
      }

      const qrBox = document.getElementById("qrBox");
      if (coupon > 0) {
         qrBox.style.display = "block";
         document.getElementById("myQrCode").src = "https://quickchart.io/qr?text=" + globalUserId + "&margin=1&size=140";
      } else {
         qrBox.style.display = "none";
      }
    }

    startApp();
  </script>
</body>
</html>
