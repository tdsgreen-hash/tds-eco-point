<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDS Eco Point</title>
  <style>
    body { font-family: 'Kanit', sans-serif; text-align: center; padding: 20px; background-color: #f5f5f5; }
    .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 20px; }
    img#profile { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 10px; }
    h2 { color: #00b900; }
    .loading { color: #666; font-style: italic; }
    .success-text { color: #00b900; font-weight: bold; }
    .info-text { color: #0056b3; font-weight: bold; }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

  <div class="container">
    <img id="profile" src="https://via.placeholder.com/80" alt="Profile">
    <h3 id="name">Initializing...</h3>
    <p id="statusMessage" class="loading">Please wait...</p>
    <h2>Total Points: <span id="pointDisplay">-</span> pts</h2>
    
    <hr style="border:0; border-top:1px solid #ddd; margin: 20px 0;">
    
    <!-- ส่วนแสดง QR Code สำหรับแลกของรางวัล -->
    <div id="rewardSection" style="display:none;">
       <p style="color: #ff9800; font-weight: bold;">แสดง QR นี้ให้ร้านค้าเพื่อแลกคูปอง 50 บาท</p>
       <img id="myQrCode" src="" alt="My QR Code" style="width:150px; height:150px; border: 2px solid #ddd; padding: 5px; border-radius: 10px;">
    </div>
  </div>

  <script>
    // 🚨 1. อย่าลืมนำ เว็บแอป URL จาก Google มาใส่ในเครื่องหมายคำพูดด้านล่างด้วยนะครับ
    const GAS_URL = "https://script.google.com/macros/s/AKfycbze86F9Xs1hnIY_KvdKCXXpqkPjUKireyliU8IxmAO-dhLBZq93RQGwlOtarseFlIYU/exec"; 
    
    // 2. LIFF ID
    const LIFF_ID = "2010933373-leG4HPtR"; 

    function startApp() {
      document.getElementById("statusMessage").innerText = "1. Connecting to LINE...";
      
      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (liff.isLoggedIn()) {
             document.getElementById("statusMessage").innerText = "2. Fetching profile data...";
             liff.getProfile().then(profile => {
               document.getElementById("name").innerText = profile.displayName;
               document.getElementById("profile").src = profile.pictureUrl || "https://via.placeholder.com/80";

               document.getElementById("statusMessage").innerText = "3. Processing points...";

               const urlParams = new URLSearchParams(window.location.search);
               const shopName = urlParams.get('shop') || "Unknown Shop";
               const pointsToSave = parseInt(urlParams.get('point') || 0);

               const requestData = {
                 userId: profile.userId,
                 displayName: profile.displayName,
                 shopName: shopName,
                 points: pointsToSave
               };

               fetch(GAS_URL, {
                 method: 'POST',
                 headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                 body: JSON.stringify(requestData)
               })
               .then(response => response.json())
               .then(result => {
                 if (result.status === "success") {
                   // แสดงข้อความภาษาอังกฤษ
                   if (pointsToSave === 0 || shopName === "CheckPoint") {
                       document.getElementById("statusMessage").innerHTML = "<span class='info-text'>Your Current Point Balance 📊</span>";
                   } else {
                       document.getElementById("statusMessage").innerHTML = "<span class='success-text'>Success! (+" + pointsToSave + " pts from " + shopName + ") ✅</span>";
                   }
                   document.getElementById("pointDisplay").innerText = result.totalPoint;
                   // ถ้าแต้มเกิน 50 ให้แสดง QR Code
if (result.totalPoint >= 50) {
   document.getElementById("rewardSection").style.display = "block";
   document.getElementById("myQrCode").src = "https://quickchart.io/qr?text=" + profile.userId + "&margin=1&size=150";
}
                 } else {
                   document.getElementById("statusMessage").innerText = "System Error: " + result.message;
                 }
               })
               .catch(error => {
                 document.getElementById("statusMessage").innerText = "Database connection failed.";
               });

             }).catch(err => {
               document.getElementById("statusMessage").innerText = "Failed to fetch profile data.";
             });
          } else {
             liff.login();
          }
        })
        .catch((err) => {
          document.getElementById("statusMessage").innerText = "LIFF initialization failed.";
        });
    }

    startApp();
  </script>

</body>
</html>
