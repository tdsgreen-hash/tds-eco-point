<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สรุปยอดร้านค้า / Merchant Dashboard</title>
  <style>
    body { font-family: 'Kanit', sans-serif; padding: 15px; background-color: #f5f5f5; color: #333; margin: 0; }
    .container { background: white; padding: 20px; border-radius: 12px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    input[type="text"], input[type="month"] { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center; box-sizing: border-box; font-family: 'Kanit', sans-serif;}
    button { background: #ff9800; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 15px; }
    
    .filter-box { background: #fff3e0; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ffe0b2; display: none; }
    .summary-box-points { background: #e3f2fd; padding: 15px; border-radius: 8px; margin: 10px 0; text-align: center; border-left: 5px solid #1565c0; }
    .summary-box-redeem { background: #e8f5e9; padding: 15px; border-radius: 8px; margin: 10px 0; text-align: center; border-left: 5px solid #2e7d32; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 13px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    .th-points { background-color: #1976d2; color: white; }
    .th-redeem { background-color: #2e7d32; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    h4 { margin: 0 0 5px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h3 style="color: #333; margin-top: 0; text-align: center;">📊 สรุปยอดร้านค้า</h3>
    
    <input type="text" id="merchantName" placeholder="พิมพ์ชื่อร้านค้าของคุณ..." required>
    <button onclick="loadHistory()">โหลดข้อมูล / Load Data</button>
    
    <!-- ส่วนตัวกรองรายเดือน -->
    <div id="filterSection" class="filter-box">
       <label style="font-size: 14px; color: #e65100; font-weight: bold; display: block; margin-bottom: 8px; text-align: center;">📅 กรองข้อมูลตามเดือน (ปล่อยว่างเพื่อดูทั้งหมด)</label>
       <input type="month" id="monthFilter" onchange="applyFilter()" style="margin-bottom: 0;">
    </div>

    <!-- ส่วนที่ 1: ประวัติคนมาสะสมแต้ม -->
    <div class="summary-box-points">
      <h4 style="color: #1565c0;">⭐️ ลูกค้ามาสะสมแต้ม</h4>
      <p style="margin: 0; font-size: 14px;">จำนวนลูกค้า: <b id="totalCustomers" style="font-size: 18px; color:#d32f2f;">0</b> คน</p>
      <p style="margin: 0; font-size: 14px;">แจกแต้มรวม: <b id="totalPointsGiven" style="font-size: 18px; color:#1565c0;">0</b> pts</p>
    </div>
    <div style="overflow-x: auto; max-height: 250px; overflow-y: auto;">
      <table>
        <thead>
          <tr><th class="th-points">เวลา</th><th class="th-points">ลูกค้า</th><th class="th-points">แต้ม</th></tr>
        </thead>
        <tbody id="pointsTableBody">
          <tr><td colspan="3" style="color: #777;">กรุณากรอกชื่อร้านเพื่อโหลดข้อมูล</td></tr>
        </tbody>
      </table>
    </div>

    <!-- ส่วนที่ 2: ประวัติคนมาแลกคูปอง -->
    <div class="summary-box-redeem">
      <h4 style="color: #2e7d32;">🛍️ ลูกค้ามาใช้คูปอง</h4>
      <p style="margin: 0; font-size: 14px;">ยอดขายคูปองรวม: <b id="totalRedeemAmount" style="font-size: 18px; color:#2e7d32;">0</b> THB</p>
    </div>
    <div style="overflow-x: auto; max-height: 250px; overflow-y: auto;">
      <table>
        <thead>
          <tr><th class="th-redeem">เวลา</th><th class="th-redeem">ลูกค้า</th><th class="th-redeem">ยอดหัก(THB)</th></tr>
        </thead>
        <tbody id="redeemTableBody">
          <tr><td colspan="3" style="color: #777;">กรุณากรอกชื่อร้านเพื่อโหลดข้อมูล</td></tr>
        </tbody>
      </table>
    </div>
    
  </div>

  <script>
    // 🚨 อย่าลืมตรวจสอบ Web App URL 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbze86F9Xs1hnIY_KvdKCXXpqkPjUKireyliU8IxmAO-dhLBZq93RQGwlOtarseFlIYU/exec"; 
    
    // ตัวแปรเก็บข้อมูลดิบทั้งหมดเพื่อใช้ตอน Filter
    let allPointsData = [];
    let allRedeemData = [];

    function loadHistory() {
      const shop = document.getElementById("merchantName").value;
      if (!shop) { alert("กรุณาพิมพ์ชื่อร้านค้าก่อนครับ!"); return; }

      document.getElementById("pointsTableBody").innerHTML = `<tr><td colspan="3">กำลังโหลด...</td></tr>`;
      document.getElementById("redeemTableBody").innerHTML = `<tr><td colspan="3">กำลังโหลด...</td></tr>`;
      document.getElementById("filterSection").style.display = "none";

      const requestData = { action: "history", merchantName: shop };

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(requestData)
      })
      .then(res => res.json())
      .then(result => {
        if (result.status === "success") {
           allPointsData = result.pointData;
           allRedeemData = result.redeemData;
           
           // รีเซ็ตตัวกรองเดือนเป็นค่าว่าง และโชว์กล่องตัวกรอง
           document.getElementById("monthFilter").value = "";
           document.getElementById("filterSection").style.display = "block";
           
           // สั่งประมวลผลแสดงข้อมูลทั้งหมด
           applyFilter();
        } else {
           alert("เกิดข้อผิดพลาดในการดึงข้อมูล");
        }
      })
      .catch(err => {
         alert("เชื่อมต่อฐานข้อมูลล้มเหลว");
      });
    }

    function applyFilter() {
       const monthVal = document.getElementById("monthFilter").value; // รูปแบบ "YYYY-MM"
       
       let filteredPoints = allPointsData;
       let filteredRedeems = allRedeemData;

       // ถ้ามีการเลือกเดือน ให้ทำการกรองข้อมูล
       if (monthVal) {
         const [year, month] = monthVal.split("-");
         
         filteredPoints = allPointsData.filter(item => {
            let d = new Date(item.date);
            return d.getFullYear() == parseInt(year) && (d.getMonth() + 1) == parseInt(month);
         });

         filteredRedeems = allRedeemData.filter(item => {
            let d = new Date(item.date);
            return d.getFullYear() == parseInt(year) && (d.getMonth() + 1) == parseInt(month);
         });
       }

       renderTables(filteredPoints, filteredRedeems);
    }

    function renderTables(pointList, redeemList) {
       // 1. จัดการแสดงผลตารางแจกแต้ม
       let pTbody = document.getElementById("pointsTableBody");
       pTbody.innerHTML = "";
       let totalPts = 0;

       if (pointList.length === 0) {
          pTbody.innerHTML = `<tr><td colspan="3" style="color: #777;">ไม่มีข้อมูลในเดือนที่เลือก</td></tr>`;
       } else {
          pointList.forEach(item => {
            totalPts += parseInt(item.points || 0);
            let dateStr = new Date(item.date).toLocaleString('th-TH', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
            pTbody.innerHTML += `<tr><td>${dateStr}</td><td>${item.customer}</td><td style="color:#1565c0; font-weight:bold;">${item.points}</td></tr>`;
          });
       }
       document.getElementById("totalCustomers").innerText = pointList.length;
       document.getElementById("totalPointsGiven").innerText = totalPts.toLocaleString();

       // 2. จัดการแสดงผลตารางหักคูปอง
       let rTbody = document.getElementById("redeemTableBody");
       rTbody.innerHTML = "";
       let totalRedeem = 0;

       if (redeemList.length === 0) {
          rTbody.innerHTML = `<tr><td colspan="3" style="color: #777;">ไม่มีข้อมูลในเดือนที่เลือก</td></tr>`;
       } else {
          redeemList.forEach(item => {
            totalRedeem += parseFloat(item.amount || 0);
            let dateStr = new Date(item.date).toLocaleString('th-TH', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
            rTbody.innerHTML += `<tr><td>${dateStr}</td><td>${item.customer}</td><td style="color:#2e7d32; font-weight:bold;">${item.amount}</td></tr>`;
          });
       }
       document.getElementById("totalRedeemAmount").innerText = totalRedeem.toLocaleString();
    }
  </script>
</body>
</html>
