<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติการใช้สิทธิ์ของร้านค้า / Merchant History</title>
  <style>
    body { font-family: 'Kanit', sans-serif; padding: 15px; background-color: #f5f5f5; color: #333; margin: 0; }
    .container { background: white; padding: 15px; border-radius: 12px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    input[type="text"] { width: 92%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center;}
    button { background: #ff9800; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
    
    .summary-box { background: #e8f5e9; padding: 10px; border-radius: 8px; margin: 15px 0; text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background-color: #2e7d32; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
  </style>
</head>
<body>
  <div class="container">
    <h3 style="color: #2e7d32; margin-top: 0; text-align: center;">📊 ประวัติการรับแลกคูปอง</h3>
    
    <input type="text" id="merchantName" placeholder="พิมพ์ชื่อร้านค้าของคุณเพื่อค้นหา..." required>
    <button onclick="loadHistory()">1. โหลดประวัติการขาย / Load History</button>
    
    <div class="summary-box">
      <p style="margin: 0; font-size: 14px; color: #2e7d32;">ยอดสะสมรวมทั้งหมด: <b id="totalAmount" style="font-size: 18px;">0</b> THB</p>
    </div>

    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>เวลา</th>
            <th>ลูกค้า</th>
            <th>ยอดหัก (THB)</th>
          </tr>
        </thead>
        <tbody id="historyTableBody">
          <tr><td colspan="3" style="color: #777;">กรุณากรอกชื่อร้านแล้วกดโหลดข้อมูล</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbze86F9Xs1hnIY_KvdKCXXpqkPjUKireyliU8IxmAO-dhLBZq93RQGwlOtarseFlIYU/exec"; 

    function loadHistory() {
      const shop = document.getElementById("merchantName").value;
      if (!shop) { alert("กรุณาพิมพ์ชื่อร้านค้าก่อนครับ!"); return; }

      const tbody = document.getElementById("historyTableBody");
      tbody.innerHTML = `<tr><td colspan="3" style="color: #777;">กำลังโหลดข้อมูล...</td></tr>`;

      const requestData = {
        action: "history",
        merchantName: shop
      };

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(requestData)
      })
      .then(res => res.json())
      .then(result => {
        if (result.status === "success") {
           let list = result.data;
           tbody.innerHTML = "";
           let grandTotal = 0;

           if (list.length === 0) {
              tbody.innerHTML = `<tr><td colspan="3" style="color: #777;">ยังไม่มีประวัติการทำรายการ</td></tr>`;
              document.getElementById("totalAmount").innerText = "0";
              return;
           }

           list.forEach(item => {
             grandTotal += parseFloat(item.amount || 0);
             let row = `<tr>
               <td>${item.date}</td>
               <td>${item.customer}</td>
               <td style="color: #d32f2f; font-weight: bold;">${item.amount}</td>
             </tr>`;
             tbody.innerHTML += row;
           });

           document.getElementById("totalAmount").innerText = grandTotal.toLocaleString();
        } else {
           alert("เกิดข้อผิดพลาดในการดึงข้อมูล");
        }
      })
      .catch(err => {
         alert("เชื่อมต่อฐานข้อมูลล้มเหลว");
      });
    }
  </script>
</body>
</html>
