<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสแกนคูปอง (สำหรับร้านค้า)</title>
  <style>
    body { font-family: 'Kanit', sans-serif; text-align: center; padding: 20px; background-color: #333; color: white; }
    .container { background: white; color: black; padding: 20px; border-radius: 10px; max-width: 400px; margin: 0 auto; }
    #reader { width: 100%; margin-bottom: 20px; }
    input[type="text"] { width: 90%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; text-align: center;}
    .result-box { margin-top: 20px; padding: 15px; border-radius: 10px; background-color: #e8f5e9; color: #2e7d32; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="color: #ff9800;">สแกนเพื่อตัดคูปอง 50฿</h2>
    <input type="text" id="merchantName" placeholder="พิมพ์ชื่อร้านค้าของคุณที่นี่..." required>
    
    <div id="reader"></div>
    <p id="statusText">กรุณาเล็งกล้องไปที่หน้าจอของลูกค้า</p>
    
    <div id="resultBox" class="result-box">
       <h3 style="margin:0;">✅ สำเร็จ!</h3>
       <p>ลูกค้า: <span id="resName"></span></p>
       <p>Ref Code: <b id="resCode" style="font-size: 1.2em;"></b></p>
       <button onclick="location.reload()" style="padding: 10px; margin-top: 10px; background: #333; color: white; border: none; border-radius: 5px;">สแกนคนต่อไป</button>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script>
    // 🚨 ใส่ Web App URL ของคุณตรงนี้
    const GAS_URL = "https://script.google.com/macros/s/AKfycbze86F9Xs1hnIY_KvdKCXXpqkPjUKireyliU8IxmAO-dhLBZq93RQGwlOtarseFlIYU/exec"; 
    
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);

    function onScanSuccess(decodedText, decodedResult) {
      const shop = document.getElementById("merchantName").value;
      if (!shop) { alert("กรุณาพิมพ์ชื่อร้านค้าก่อนสแกนครับ!"); return; }

      html5QrcodeScanner.clear();
      document.getElementById("statusText").innerText = "กำลังประมวลผลการหักแต้ม...";

      const requestData = {
        action: "redeem",
        merchantName: shop,
        customerId: decodedText, // รหัสที่ซ่อนอยู่ในคิวอาร์โค้ด
        deductAmount: 50 // หัก 50 แต้มคงที่
      };

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(requestData)
      })
      .then(response => response.json())
      .then(result => {
        if(result.status === "success") {
           document.getElementById("statusText").style.display = "none";
           document.getElementById("resultBox").style.display = "block";
           document.getElementById("resName").innerText = result.customerName;
           document.getElementById("resCode").innerText = result.refCode;
        } else {
           alert("เกิดข้อผิดพลาด: " + result.message);
           location.reload();
        }
      })
      .catch(error => alert("เชื่อมต่อฐานข้อมูลล้มเหลว"));
    }

    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
