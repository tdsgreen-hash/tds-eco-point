<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสแกนตัดยอดคูปอง (ร้านค้า)</title>
  <style>
    body { font-family: 'Kanit', sans-serif; text-align: center; padding: 15px; background-color: #222; color: white; margin: 0; }
    .container { background: white; color: black; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    input[type="text"], input[type="number"] { width: 92%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center;}
    
    /* ดีไซน์ปุ่มเปิดกล้องสแกนแบบพรีเมียม กดปุ๊บเด้งกล้องแท้ของมือถือทันที */
    .scan-btn {
      background: #ff9800; color: white; border: none; padding: 15px; width: 100%;
      font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 5px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .scan-btn:active { background: #f57c00; }
    
    .result-box { margin-top: 15px; padding: 15px; border-radius: 10px; background-color: #e8f5e9; color: #2e7d32; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h3 style="color: #333; margin: 0 0 15px 0;">📸 สแกนตัดยอดคูปอง</h3>
    
    <input type="text" id="merchantName" placeholder="พิมพ์ชื่อร้านค้าของคุณ..." required>
    <input type="number" id="deductBaht" placeholder="ระบุยอดเงินที่จะหัก (เช่น 20, 30)" value="20" required>
    
    <!-- ปุ่มกดเปิดกล้องมือถือเพื่อสแกน (ซ่อนตัว input file แท้ไว้ แล้วใช้ปุ่มกดสั่ง) -->
    <input type="file" id="qr-input-file" accept="image/*" capture="environment" style="display:none;">
    <button class="scan-btn" onclick="openCamera()">📷 กดเพื่อสแกน QR ลูกค้า</button>
    
    <p id="statusText" style="font-size: 13px; color: #666; margin-top: 10px;">แตะปุ่มเพื่อเปิดกล้องหลังสแกน</p>
    
    <div id="resultBox" class="result-box">
       <h3 style="margin:0;">✅ หักยอดสำเร็จ!</h3>
       <p>ลูกค้า: <span id="resName"></span></p>
       <p>หักเงิน: <b style="color: #d32f2f;"><span id="resAmount"></span> THB</b></p>
       <p>ยอดคูปองคงเหลือ: <b style="color: #1565c0;"><span id="resRemaining"></span> THB</b></p>
       <p>Ref Code: <b id="resCode" style="font-size: 1.1em;"></b></p>
       <button onclick="location.reload()" style="padding: 10px 20px; margin-top: 10px; background: #333; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px;">สแกนคนต่อไป</button>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script>
    // 🚨 ใส่ Web App URL ของ Google Apps Script ตรงนี้
    const GAS_URL = "https://script.google.com/macros/s/AKfycbze86F9Xs1hnIY_KvdKCXXpqkPjUKireyliU8IxmAO-dhLBZq93RQGwlOtarseFlIYU/exec"; 

    function openCamera() {
      const shop = document.getElementById("merchantName").value;
      const baht = parseInt(document.getElementById("deductBaht").value);

      if (!shop) { alert("กรุณาพิมพ์ชื่อร้านค้าก่อนกดสแกนครับ!"); return; }
      if (!baht || baht <= 0) { alert("กรุณาระบุยอดเงินที่จะหักให้ถูกต้อง!"); return; }

      // สั่งเปิดตัวเลือกไฟล์ระบบ (ซึ่งถูกบังคับให้เปิดกล้องหลังด้วย capture="environment")
      document.getElementById('qr-input-file').click();
    }

    // เมื่อถ่ายภาพหรือสแกน QR Code เสร็จ ระบบจะอ่านค่าอัตโนมัติ
    const html5QrCode = new Html5Qrcode("qr-input-file");
    
    document.getElementById('qr-input-file').addEventListener('change', e => {
      if (e.target.files.length == 0) { return; }
      const imageFile = e.target.files[0];
      
      document.getElementById("statusText").innerText = "กำลังประมวลผล QR Code...";

      html5QrCode.scanFile(imageFile, true)
      .then(decodedText => {
          // สแกนสำเร็จ ส่งข้อมูลไปหลังบ้านทันที
          sendDataToBackend(decodedText);
      })
      .catch(err => {
          alert("ไม่พบ QR Code ในภาพ กรุณาลองใหม่อีกครั้ง");
          document.getElementById("statusText").innerText = "แตะปุ่มเพื่อเปิดกล้องหลังสแกน";
      });
    });

    function sendDataToBackend(customerId) {
      const shop = document.getElementById("merchantName").value;
      const baht = parseInt(document.getElementById("deductBaht").value);

      const requestData = {
        action: "redeem",
        merchantName: shop,
        customerId: customerId,
        deductBaht: baht
      };

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(requestData)
      })
      .then(response => response.json())
      .then(result => {
        if(result.status === "success") {
           document.getElementById("statusText").style.display = "none";
           document.querySelector(".scan-btn").style.display = "none";
           document.getElementById("resultBox").style.display = "block";
           document.getElementById("resName").innerText = result.customerName;
           document.getElementById("resAmount").innerText = baht;
           document.getElementById("resRemaining").innerText = result.remainingCoupon;
           document.getElementById("resCode").innerText = result.refCode;
        } else {
           alert("เกิดข้อผิดพลาด: " + result.message);
           location.reload();
        }
      })
      .catch(error => {
        alert("เชื่อมต่อฐานข้อมูลล้มเหลว");
        location.reload();
      });
    }
  </script>
</body>
</html>
