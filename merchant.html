<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสแกนตัดยอดคูปอง (ร้านค้า)</title>
  <style>
    body { font-family: 'Kanit', sans-serif; text-align: center; padding: 15px; background-color: #222; color: white; margin: 0; }
    .container { background: white; color: black; padding: 15px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    #reader { width: 100%; min-height: 250px; border-radius: 8px; overflow: hidden; background: #000; margin-bottom: 10px; position: relative; }
    
    /* ซ่อนปุ่มเลือกไฟล์และเมนูส่วนเกินทั้งหมด บังคับใช้กล้องอย่างเดียว */
    #reader__dashboard_section_csr, 
    #reader__dashboard_section_swap_camera,
    #html5-qrcode-anchor-scan-type-change,
    label[for="file"] { display: none !important; }
    
    input[type="text"], input[type="number"] { width: 92%; padding: 10px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center;}
    .result-box { margin-top: 15px; padding: 15px; border-radius: 10px; background-color: #e8f5e9; color: #2e7d32; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h3 style="color: #ff9800; margin: 5px 0 10px 0;">สแกนตัดยอดคูปอง</h3>
    <input type="text" id="merchantName" placeholder="พิมพ์ชื่อร้านค้าของคุณ..." required>
    <input type="number" id="deductBaht" placeholder="ระบุยอดเงินที่จะหัก (เช่น 20, 30)" value="20" required>
    
    <!-- ช่องแสดงกล้องสแกน -->
    <div id="reader"></div>
    <p id="statusText" style="font-size: 13px; color: #555; margin: 5px 0;">เล็งกล้องไปที่ QR Code ของลูกค้า</p>
    
    <div id="resultBox" class="result-box">
       <h3 style="margin:0;">✅ หักยอดสำเร็จ!</h3>
       <p>ลูกค้า: <span id="resName"></span></p>
       <p>หักเงิน: <b style="color: #d32f2f;"><span id="resAmount"></span> THB</b></p>
       <p>ยอดคูปองคงเหลือ: <b style="color: #1565c0;"><span id="resRemaining"></span> THB</b></p>
       <p>Ref Code: <b id="resCode" style="font-size: 1.1em;"></b></p>
       <button onclick="location.reload()" style="padding: 10px 20px; margin-top: 10px; background: #333; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px;">สแกนคนต่อไป</button>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script>
    // 🚨 ใส่ Web App URL ของ Google Apps Script ตรงนี้
    const GAS_URL = "https://script.google.com/macros/s/AKfycbze86F9Xs1hnIY_KvdKCXXpqkPjUKireyliU8IxmAO-dhLBZq93RQGwlOtarseFlIYU/exec"; 

    function onScanSuccess(decodedText, decodedResult) {
      const shop = document.getElementById("merchantName").value;
      const baht = parseInt(document.getElementById("deductBaht").value);

      if (!shop) { alert("กรุณาพิมพ์ชื่อร้านค้าก่อนสแกนครับ!"); return; }
      if (!baht || baht <= 0) { alert("กรุณาระบุยอดเงินที่จะหักให้ถูกต้อง!"); return; }

      // ปิดกล้องทันทีที่สแกนเจอ
      html5QrcodeScanner.clear().catch(error => { console.error(error); });

      document.getElementById("statusText").innerText = "กำลังประมวลผลหักยอดคูปอง...";

      const requestData = {
        action: "redeem",
        merchantName: shop,
        customerId: decodedText,
        deductBaht: baht
      };

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(requestData)
      })
      .then(response => response.json())
      .then(result => {
        if(result.status === "success") {
           document.getElementById("statusText").style.display = "none";
           document.getElementById("reader").style.display = "none";
           document.getElementById("resultBox").style.display = "block";
           document.getElementById("resName").innerText = result.customerName;
           document.getElementById("resAmount").innerText = baht;
           document.getElementById("resRemaining").innerText = result.remainingCoupon;
           document.getElementById("resCode").innerText = result.refCode;
        } else {
           alert("เกิดข้อผิดพลาด: " + result.message);
           location.reload();
        }
      })
      .catch(error => {
        alert("เชื่อมต่อฐานข้อมูลล้มเหลว");
        location.reload();
      });
    }

    // ใช้ Html5QrcodeScanner แบบระบุให้เปิดกล้องหลังอัตโนมัติ
    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", 
      { 
        fps: 10, 
        qrbox: { width: 220, height: 220 },
        aspectRatio: 1.0,
        rememberLastUsedCamera: true
      }, 
      /* verbose= */ false
    );
    
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
